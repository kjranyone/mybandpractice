[package]
name = "mbp-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "UniFFI surface for the mybandpractice v2 core"

[lib]
crate-type = ["lib", "cdylib"]
name = "mbp_ffi"

[dependencies]
jni = "0.21"
mbp-core = { path = "../core" }
thiserror = "2"
uniffi = "0.29"

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
